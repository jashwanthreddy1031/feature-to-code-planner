{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <div class="card">
        <div class="auth-header">
            <h2>Welcome Back</h2>
            <p>Enter your credentials to access your project dashboard.</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="email">Email Address <span class="req">*</span></label>
                <input type="email" id="email" name="email" value="{{ email or '' }}" required autofocus placeholder="name@example.com">
            </div>

            <div class="form-group">
                <label for="password">Password <span class="req">*</span></label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>

            <button type="submit" style="width: 100%; margin-top: 10px;">Sign In</button>
        </form>

        <p style="text-align: center; margin-top: 22px; font-size: 0.88rem; color: var(--text-muted);">
            Don't have an account? <a href="{{ url_for('signup') }}" style="color: var(--primary-mid); font-weight: 700; text-decoration: none;">Create an account</a>
        </p>
    </div>
</div>
{% endblock %}
